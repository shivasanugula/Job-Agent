name: Run Job Scraper Agent

on:
  schedule:
    - cron: '0 */3 * * *' # Runs automatically every 3 hours
  workflow_dispatch: # Allows you to trigger it manually with a button click

jobs:
  scrape-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Speeds up your runs by caching packages!

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas openpyxl python-dotenv langchain-core langchain-groq langgraph

      - name: Install Playwright Browsers
        run: |
          playwright install chromium
          playwright install-deps

      - name: Run Job Scraper Agent
        env:
          # This maps your GitHub Secrets to the script's environment variables
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
        run: python agent.py

      - name: Upload Cleaned Jobs Excel File
        uses: actions/upload-artifact@v4
        with:
          name: Cleaned-Jobs-List
          path: cleaned_jobs_extract_2.xlsx
          retention-days: 3 # Keeps your storage clean
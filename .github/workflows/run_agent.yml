name: 3-Hour Autonomous Job Scraper

on:
  schedule:
    # Runs at minute 0 past every 3rd hour
    - cron: '0 */3 * * *'
  workflow_dispatch: # Adds a button to let you trigger it manually anytime

jobs:
  scrape-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas openpyxl python-dotenv langchain-core langchain-groq langgraph
          playwright install chromium
          playwright install-deps

      - name: Run Job Scraper Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python agent.py

      - name: Upload Cleaned Jobs Excel File
        uses: actions/upload-artifact@v4
        with:
          name: Cleaned-Jobs-Extract
          path: cleaned_jobs_extract_2.xlsx
          retention-days: 7 # Keeps the file available for download for 7 days
